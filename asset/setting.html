<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <link rel="stylesheet" href="../static/css/style.css">

</head>

<body>

    <div class="mobile-menu-btn" onclick="toggleSidebar()">☰</div>

    <div class="wrapper">

        <!-- Sidebar -->

        <aside class="sidebar" id="sidebar">

            <div class="logo">

                <h2>MediCore</h2>

                <span>Hospital ERP</span>

            </div>

            <ul>

                <li><a href="dashboard.html">Dashboard</a></li>

                <li><a href="patient_list.html">Patients</a></li>

                <li><a href="doctor_list.html">Doctors</a></li>

                <li><a href="employee_list.html">Employees</a></li>

                <li><a href="appointment_list.html">Appointments</a></li>

                <li><a href="profile.html">Profile</a></li>

                <li class="active"><a href="settings.html">Settings</a></li>

            </ul>

        </aside>

        <!-- Main -->

        <main class="main">

            <div class="page-header">

                <div>

                    <h1>Settings</h1>

                    <p>Manage hospital system preferences</p>

                </div>

            </div>

            <div class="settings-grid">

                <div class="setting-card">

                    <h3>Hospital Information</h3>

                    <div class="form-group">

                        <label>Hospital Name</label>

                        <input type="text" value="MediCore Hospital">

                    </div>

                    <div class="form-group">

                        <label>Email</label>

                        <input type="email" value="info@medicore.com">

                    </div>

                    <div class="form-group">

                        <label>Phone</label>

                        <input type="text" value="+8801712345678">

                    </div>

                    <div class="form-group">

                        <label>Address</label>

                        <textarea rows="4">Dhaka, Bangladesh</textarea>

                    </div>

                </div>

                <div class="setting-card">

                    <h3>Account Settings</h3>

                    <div class="form-group">

                        <label>Username</label>

                        <input type="text" value="admin">

                    </div>

                    <div class="form-group">

                        <label>New Password</label>

                        <input type="password">

                    </div>

                    <div class="form-group">

                        <label>Confirm Password</label>

                        <input type="password">

                    </div>

                    <div class="form-buttons">

                        <button class="btn-primary">

                            Save Changes

                        </button>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <script>

        function toggleSidebar() {

            document.getElementById("sidebar").classList.toggle("show");

        }

    </script>

</body>

</html>
