<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <link rel="stylesheet" href="../static/css/style.css">

</head>

<body>

    <div class="mobile-menu-btn" onclick="toggleSidebar()">☰</div>

    <div class="wrapper">

        <!-- Sidebar -->

        <aside class="sidebar" id="sidebar">

            <div class="logo">

                <h2>MediCore</h2>

                <span>Hospital ERP</span>

            </div>

            <ul>

                <li><a href="dashboard.html">Dashboard</a></li>

                <li><a href="patient_list.html">Patients</a></li>

                <li><a href="doctor_list.html">Doctors</a></li>

                <li><a href="employee_list.html">Employees</a></li>

                <li><a href="appointment_list.html">Appointments</a></li>

                <li class="active"><a href="profile.html">Profile</a></li>

            </ul>

        </aside>

        <!-- Main -->

        <main class="main">

            <div class="page-header">

                <div>

                    <h1>My Profile</h1>

                    <p>Manage your account information</p>

                </div>

                <a href="settings.html" class="btn-primary">

                    Settings

                </a>

            </div>

            <div class="profile-grid">

                <div class="profile-card">

                    <div class="profile-image">

                        A

                    </div>

                    <h2>Admin User</h2>

                    <p>System Administrator</p>

                    <div class="profile-status">

                        <span class="badge success">

                            Active

                        </span>

                    </div>

                </div>

                <div class="form-card">

                    <form>

                        <div class="form-grid">

                            <div class="form-group">

                                <label>Full Name</label>

                                <input type="text" value="Admin User">

                            </div>

                            <div class="form-group">

                                <label>Email</label>

                                <input type="email" value="admin@hospital.com">

                            </div>

                            <div class="form-group">

                                <label>Phone</label>

                                <input type="text" value="+8801712345678">

                            </div>

                            <div class="form-group">

                                <label>Role</label>

                                <input type="text" value="Administrator">

                            </div>

                        </div>

                        <div class="form-group">

                            <label>Address</label>

                            <textarea rows="5">Dhaka, Bangladesh</textarea>

                        </div>

                        <div class="form-buttons">

                            <button class="btn-primary">

                                Update Profile

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </div>

    <script>

        function toggleSidebar() {

            document.getElementById("sidebar").classList.toggle("show");

        }

    </script>

</body>

</html>
